name: stock-streaming-platform

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
    ports:
      - "19092:19092" # Kafka API (host)
      - "18081:18081" # Schema registry (host)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocks}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./storage/timescale/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock} -d ${POSTGRES_DB:-stocks}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./storage/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  ingestion:
    build: ./ingestion
    environment:
      TRADE_SOURCE: ${TRADE_SOURCE:-simulator}
      KAFKA_BROKER: redpanda:9092
      TRADES_TOPIC: ${TRADES_TOPIC:-trades.raw}
      SYMBOLS: ${SYMBOLS:-AAPL,MSFT,NVDA,TSLA}
      SIM_TRADES_PER_SEC: ${SIM_TRADES_PER_SEC:-5}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  spark-ohlcv:
    build: ./processing/spark
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[*]
      - --driver-memory=1g
      - /app/jobs/ohlcv_aggregation.py
    environment: &spark-env
      KAFKA_BROKER: redpanda:9092
      TRADES_TOPIC: ${TRADES_TOPIC:-trades.raw}
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB:-stocks}
      PG_USER: ${POSTGRES_USER:-stock}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-stock_dev_password}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CHECKPOINT_LOCATION: s3a://checkpoints/ohlcv_aggregation
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-bronze:
    build: ./processing/spark
    command:
      - /opt/spark/bin/spark-submit
      - --master=local[*]
      - --driver-memory=1g
      - /app/jobs/trades_to_bronze.py
    environment:
      <<: *spark-env
      BRONZE_PATH: s3a://bronze/trades
      CHECKPOINT_LOCATION: s3a://checkpoints/trades_to_bronze
    depends_on:
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB:-stocks}
      PG_USER: ${POSTGRES_USER:-stock}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-stock_dev_password}
      KAFKA_BROKER: redpanda:9092
      TRADES_TOPIC: ${TRADES_TOPIC:-trades.raw}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
  timescale-data:
  minio-data:
