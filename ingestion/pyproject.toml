[project]
name = "ingestion"
version = "0.1.0"
description = "Trade ingestion: Finnhub WebSocket / simulator -> Redpanda"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "pydantic>=2.9",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
